<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1917" />
      <stop offset="100%" stop-color="#0D0B0A" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6A28" />
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E1B2F" />
      <stop offset="100%" stop-color="#5B0E1B" />
    </linearGradient>
  </defs>

  <!-- Fundo Circular Luxuoso -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4" />

  <!-- Monograma Estilizado: Taça & Cacho de Uvas Geométrico -->
  <g transform="translate(256, 230)">
    <!-- Taça Cálice -->
    <path d="M-60,-120 C-60,-20 60,-20 60,-120 Z" fill="url(#ruby)" opacity="0.85" stroke="url(#gold)" stroke-width="3" />
    <!-- Haste e Base da Taça -->
    <path d="M0,-20 L0,80 M-50,80 L50,80" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />
    <!-- Cacho Dourado Estilizado em Cima -->
    <circle cx="0" cy="-140" r="14" fill="url(#gold)" />
    <circle cx="-22" cy="-158" r="12" fill="url(#gold)" opacity="0.9" />
    <circle cx="22" cy="-158" r="12" fill="url(#gold)" opacity="0.9" />
    <circle cx="-42" cy="-176" r="10" fill="url(#gold)" opacity="0.8" />
    <circle cx="0" cy="-176" r="10" fill="url(#gold)" opacity="0.8" />
    <circle cx="42" cy="-176" r="10" fill="url(#gold)" opacity="0.8" />
  </g>

  <!-- Tipografia Monograma CU -->
  <text x="256" y="380" font-family="'Cormorant Garamond', Georgia, serif" font-size="42" font-weight="600" fill="url(#gold)" text-anchor="middle" letter-spacing="6">CAMINHO DAS UVAS</text>
  <text x="256" y="415" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#A89F91" text-anchor="middle" letter-spacing="4">ALTA ADEGA • B2B</text>
</svg>
